# Use Ctrl + A rather than default b
unbind C-b
set -g prefix C-a

# Use v and h to split the screen rather than default % and "
unbind v
unbind h
unbind %
unbind '"'
bind v split-window -h -c "#{pane_current_path}"
bind h split-window -v -c "#{pane_current_path}"

# Allow clipboard
set -g set-clipboard on

# Allow scrolling with mouse/trackpad
set -g mouse on

# Fix scroll buffer
set -g terminal-overrides 'xterm:smcup@:rmcup@'

# Set terminal color screen
set -g default-terminal "screen-256color"

# Allow tmux to pass through OSC 52 to the outer terminal
set -g allow-passthrough on
